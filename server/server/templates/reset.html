{% extends "base.html" %}
{% block body %}
<h1>비밀번호 재설정</h1>
<p class="muted">이메일로 받은 코드와 새 비밀번호를 입력하세요.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" class="card">
  <input name="code" placeholder="6자리 코드" inputmode="numeric"
         style="font-size:20px; letter-spacing:3px; text-align:center;" autofocus>
  <input name="password" type="password" placeholder="새 비밀번호">
  <button type="submit">비밀번호 변경</button>
</form>
<p class="muted"><a href="{{ url_for('forgot') }}">코드를 다시 받기</a></p>
{% endblock %}
