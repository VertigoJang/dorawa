{% extends "base.html" %}
{% block body %}
<h1>내 기기 — {{ uname }}</h1>
<p><a href="{{ url_for('logout') }}">로그아웃</a></p>

<div class="card">
  <h2>새 노트북 연결</h2>
  <p class="muted">아래 버튼을 누르면 6자리 코드가 나옵니다. 노트북 설치 때 그 코드를 입력하세요. (10분간 유효)</p>
  <button onclick="getCode()">페어링 코드 만들기</button>
  <div id="codebox" class="code" style="display:none"></div>
</div>

{% if devices %}
<div class="card">
  <h2>연결된 기기</h2>
  {% for d in devices %}
    <p>
      <a href="{{ url_for('device', did=d['id']) }}">{{ d['name'] or '이름없음' }}</a>
      {% if d['lost'] %}<span class="err">🚨 도난 모드</span>{% endif %}
    </p>
  {% endfor %}
</div>
{% endif %}

<script>
async function getCode() {
  const r = await fetch('{{ url_for("paircode") }}', {method:'POST'});
  const j = await r.json();
  const box = document.getElementById('codebox');
  box.textContent = j.code;
  box.style.display = 'block';
}
</script>
{% endblock %}
