{% extends "base.html" %}
{% block body %}
<h1>Dorawa 회원가입</h1>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" class="card">
  <input name="username" placeholder="아이디" autofocus>
  <input name="email" type="email" placeholder="이메일 (인증 코드를 받습니다)">
  <input name="password" type="password" placeholder="비밀번호">
  <button type="submit">가입하고 인증 코드 받기</button>
</form>
<p class="muted">이미 계정이 있나요? <a href="{{ url_for('login') }}">로그인</a></p>
{% endblock %}
