<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dorawa</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 0 auto;
         padding: 16px; background: #f5f5f5; color: #222; }
  h1 { font-size: 20px; } h2 { font-size: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin: 12px 0;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  input { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box;
          border: 1px solid #ccc; border-radius: 6px; }
  button, .btn { padding: 10px 16px; border: 0; border-radius: 6px; background: #2563eb;
          color: #fff; font-size: 15px; cursor: pointer; text-decoration: none;
          display: inline-block; }
  .btn-danger { background: #dc2626; }
  .btn-gray { background: #6b7280; }
  .err { color: #dc2626; margin: 8px 0; }
  .code { font-size: 32px; letter-spacing: 6px; font-weight: bold; text-align: center;
          padding: 16px; background: #eef2ff; border-radius: 8px; }
  a { color: #2563eb; }
  .muted { color: #666; font-size: 13px; }
  .radio-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .radio-row input[type=radio] { width: auto; margin: 0; flex: none; }
  .radio-row input[type=number] { width: 56px; display: inline; margin: 0 4px; padding: 4px; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
