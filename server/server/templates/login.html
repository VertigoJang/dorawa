{% extends "base.html" %}
{% block body %}
<h1>Dorawa 로그인</h1>
{% if notice %}<div style="color:#16a34a;">{{ notice }}</div>{% endif %}
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" class="card">
  <input name="username" placeholder="아이디" autofocus>
  <input name="password" type="password" placeholder="비밀번호">
  <button type="submit">로그인</button>
</form>
<p class="muted">계정이 없나요? <a href="{{ url_for('register') }}">회원가입</a></p>
<p class="muted"><a href="{{ url_for('forgot') }}">비밀번호를 잊으셨나요?</a></p>
{% endblock %}
